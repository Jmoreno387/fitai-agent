<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FitAI Agent</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.container{
    width:90%;
    max-width:700px;
    background:#1e293b;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}

h1{
    text-align:center;
    margin-bottom:25px;
}

input,
select{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:20px;
    border:none;
    border-radius:10px;
    font-size:16px;
    background:#0f172a;
    color:white;
    outline:none;
    transition:0.3s;
    border:1px solid transparent;
    box-sizing:border-box;
}

input::placeholder{
    color:#94a3b8;
}

input:focus,
select:focus{
    border:1px solid #22c55e;
    box-shadow:0 0 10px rgba(34,197,94,.3);
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 4px 15px rgba(34,197,94,.3);
}

button:hover{
    background:#16a34a;
    transform:translateY(-2px);
}

button:active{
    transform:scale(0.98);
}

button:disabled{
    background:#15803d;
    cursor:not-allowed;
    opacity:0.7;
}

#btnPDF{
    display:none;
    margin-top:20px;
    background:#3b82f6;
    box-shadow:0 4px 15px rgba(59,130,246,.3);
}

#btnPDF:hover{
    background:#2563eb;
}

.loading{
    display:none;
    margin-top:20px;
    text-align:center;
    font-size:18px;
    color:#22c55e;
    font-weight:bold;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{
        opacity:0.4;
    }

    50%{
        opacity:1;
    }

    100%{
        opacity:0.4;
    }
}

#resultado{
    margin-top:30px;
    background:#0f172a;
    padding:20px;
    border-radius:10px;
    white-space:pre-wrap;
    line-height:1.8;
    animation:fadeIn 0.5s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>

</head>

<body>

<div class="container">

    <h1>FitAI Agent</h1>

    <input type="text" id="nombre" placeholder="Nombre">

    <input type="number" id="edad" placeholder="Edad">

    <input type="number" id="peso" placeholder="Peso (kg)">

    <input type="number" id="altura" placeholder="Altura (m)">

    <select id="objetivo">
        <option value="ganar masa muscular">Ganar masa muscular</option>
        <option value="ganar fuerza">Ganar fuerza</option>
        <option value="perder grasa">Perder grasa</option>
    </select>

    <input type="number" id="dias" placeholder="Días de entrenamiento">

    <button id="btnRutina" onclick="generarRutina()">
        Generar Rutina
    </button>

    <div id="loading" class="loading">
        Generando rutina con IA...
    </div>

    <div id="resultado"></div>

    <button id="btnPDF" onclick="descargarPDF()">
        Descargar PDF
    </button>

</div>

<!-- LIBRERÍA PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

async function generarRutina(){

    const data = {
        nombre: document.getElementById("nombre").value,
        edad: Number(document.getElementById("edad").value),
        peso: Number(document.getElementById("peso").value),
        altura: Number(document.getElementById("altura").value),
        objetivo: document.getElementById("objetivo").value,
        dias_entrenamiento: Number(document.getElementById("dias").value)
    };

    const loading = document.getElementById("loading");

    const boton = document.getElementById("btnRutina");

    const resultadoDiv = document.getElementById("resultado");

    resultadoDiv.innerHTML = "";

    document.getElementById("btnPDF").style.display = "none";

    // VALIDACIÓN
    if(
        !data.nombre ||
        !data.edad ||
        !data.peso ||
        !data.altura ||
        !data.dias_entrenamiento
    ){
        alert("Completa todos los campos");
        return;
    }

    // LOADING
    loading.style.display = "block";

    boton.disabled = true;

    boton.innerText = "Generando...";

    try{

        const response = await fetch(
            "http://localhost:5678/webhook/fitness-agent",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body: JSON.stringify(data)
            }
        );

        const resultado = await response.text();

        resultadoDiv.innerHTML = resultado

            .replace(/\n/g, "<br>")
            .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
            .replace(/### (.*?)(<br>|$)/g, "<h3>$1</h3>");

        resultadoDiv.scrollIntoView({
            behavior:"smooth"
        });

        // MOSTRAR BOTÓN PDF
        document.getElementById("btnPDF").style.display = "block";

    }catch(error){

        resultadoDiv.innerHTML = `
        <div style="
            color:#f87171;
            font-weight:bold;
            text-align:center;
        ">
            Error conectando con la IA ⚠️
        </div>
        `;

    }finally{

        loading.style.display = "none";

        boton.disabled = false;

        boton.innerText = "Generar Rutina";
    }
}

// DESCARGAR PDF
function descargarPDF(){

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF();

    const texto = document.getElementById("resultado").innerText;

    doc.setFont("helvetica");

    doc.setFontSize(12);

    const lineas = doc.splitTextToSize(texto, 180);

    doc.text(lineas, 15, 20);

    doc.save("rutina-fitai.pdf");
}

</script>

</body>
</html>
